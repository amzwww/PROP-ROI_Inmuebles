name: Compilar APK
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar
        run: gradle assembleRelease --no-daemon
      - name: Preparar APK
        run: cp app/build/outputs/apk/release/app-release.apk ROI-Inmuebles.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ROI-Inmuebles-apk
          path: ROI-Inmuebles.apk
      - name: Publicar version
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v1.0.${{ github.run_number }}" ROI-Inmuebles.apk --title "ROI Inmuebles 1.0.${{ github.run_number }}" --notes "APK generado automaticamente a partir del ultimo cambio."
